<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EstanteVirtual | Cadastrar Livro</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./styles/cadastrar-livro.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <i class="bi bi-book" style="font-size: 1.5rem; color: #6d28d9"></i>
        <span>Estante<strong>Virtual</strong></span>
      </div>
    </header>

    <main>
      <img src="./assets/folha.svg" class="folha-direita" />
      <img src="./assets/folha.svg" class="folha-esquerda" />

      <div class="card">
        <img
          src="./assets/cachorrinho.svg"
          alt="cachorrinho"
          class="img-cachorrinho2"
        />

        <h2>Cadastrar Livro</h2>

        <h3>Adicione uma nova leitura</h3>

        <p>Organize seus livros e acompanhe suas leituras favoritas</p>

        <form id="form-livro">
          <div class="field">
            <label for="titulo">Título do livro</label>

            <input
              type="text"
              id="titulo"
              placeholder="Digite o título do livro"
            />
          </div>

          <div class="field">
            <label for="autor">Autor</label>

            <input
              type="text"
              id="autor"
              placeholder="Digite o nome do autor"
            />
          </div>

          <div class="field">
            <label for="genero">Gênero</label>

            <input
              type="text"
              id="genero"
              placeholder="Ex: Romance, Fantasia..."
            />
          </div>

          <div class="field">
            <label for="paginas">Quantidade de páginas</label>

            <input
              type="number"
              id="paginas"
              placeholder="Digite o número de páginas"
            />
          </div>

          <div class="field">
            <label for="status">Status da leitura</label>

            <select id="status">
              <option>Lendo</option>

              <option>Quero ler</option>

              <option>Lido</option>

              <option>Relendo</option>

              <option>Abandonei</option>
            </select>
          </div>
          <div class="field" id="campo-qtd-lido" style="display: none">
            <label for="qtd_lido">Quantas páginas já foram lidas?</label>

            <input
              type="number"
              id="qtd_lido"
              min="0"
              placeholder="Digite a quantidade de páginas lidas"
            />
          </div>

          <div class="field">
            <label for="capa">Link da capa</label>

            <input
              type="url"
              id="capa"
              placeholder="Cole o link da imagem da capa"
            />
          </div>

          <button type="submit" class="primary-btn">Cadastrar livro</button>
        </form>

        <p>Deseja voltar para a biblioteca?</p>

        <button class="second-btn">
          <a href="./inicio.html">Voltar</a>
        </button>
      </div>
    </main>

    <img
      src="./assets/caminhando.svg"
      alt="homem caminhando"
      class="img-caminhando"
    />

    <img
      src="./assets/cachorrinho.svg"
      alt="cachorrinho"
      class="img-cachorrinho1"
    />
  </body>
  <script src="./script/cadastrar-livro.js"></script>
</html>
