<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstanteVirtual | Início</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="styles/inicio.css" />
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      <i class="bi bi-book" style="font-size: 1.5rem; color: #6d28d9;"></i>
      <span>Estante<strong>Virtual</strong></span>
    </div>

    <a href="cadastrar-livro.html" class="btn-adicionar">
      <i class="bi bi-plus-lg"></i>
      Adicionar livro
    </a>

    <nav class="menu">

      <a href="inicio.html" class="item-menu ativo">
        <i class="bi bi-house-door"></i>
        Início
      </a>

      <a href="comeca.html" class="item-menu">
        <i class="bi bi-journal-text"></i>
        Meus livros
      </a>

      <a href="clarisse.html" class="item-menu">
        <i class="bi bi-heart"></i>
        Favoritos
      </a>

      <a href="passos.html" class="item-menu">
        <i class="bi bi-grid"></i>
        Estantes
      </a>

      <a href="hugo.html" class="item-menu">
        <i class="bi bi-star"></i>
        Avaliações
      </a>

      <a href="configuracao.html" class="item-menu">
        <i class="bi bi-gear"></i>
        Configurações
      </a>

    </nav>

    <div class="perfil">
      <div class="avatar-perfil">I</div>

      <div class="perfil-info">
        <span class="perfil-nome">Isinha</span>

        <a href="perfil.html" class="perfil-link">
          Ver perfil
        </a>
      </div>

      <i class="bi bi-chevron-down" style="color: #aaa;"></i>
    </div>

  </aside>

  <div class="layout">

    <header class="topbar">

      <div class="busca">
        <i class="bi bi-search"></i>

        <input type="text"
          placeholder="Buscar por livro, autor ou gênero..." />
      </div>

      <div class="topbar-direita">

        <i class="bi bi-bell"
          style="font-size: 1.3rem; color: #4b5563; cursor: pointer;"></i>

        <a href="perfil.html" class="usuario-top">

          <div class="avatar-top">
            <i class="bi bi-person-fill"></i>
          </div>

          <span>Isinha</span>

          <i class="bi bi-chevron-down"
            style="color: #6b7280; font-size: 0.8rem;"></i>

        </a>

      </div>

    </header>

    <main class="conteudo">

      <section class="secao">

        <h2>Continuar a ler</h2>

        <div class="livros-lendo" id="livros-lendo">
        </div>

      </section>

      <section class="secao">

        <h2>Todos os livros</h2>

        <div class="filtros">

          <button class="filtro ativo">Todos</button>
          <button class="filtro">A ler</button>
          <button class="filtro">Quero ler</button>
          <button class="filtro">Lidos</button>
          <button class="filtro">Relidos</button>

          <div class="ordenar">
            Mais recentes
            <i class="bi bi-chevron-down"></i>
          </div>

        </div>

        <div class="grid-livros" id="grid-livros">
        </div>

      </section>

    </main>

  </div>

  <aside class="lateral-direita">

  <div class="citacao">

    <span class="aspas">"</span>

    <p>
      Um leitor vive mil vidas antes de morrer.
      O homem que nunca lê vive apenas uma.
    </p>

    <span class="autor-citacao">
      — George R.R. Martin
    </span>

  </div>

  </div>

</aside>

</body>

<script src="./script/listar-livros.js"></script>

</html>
